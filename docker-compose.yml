services:
  train:
    build: .
    image: newmachinaai/newmachina_perceptron_train:latest
    container_name: newmachina_perceptron_train
    command: ["container_train_src/perceptron_and_train.py"]
    volumes:
      - model-data:/app/and_perceptron_model

  inference:
    build: .
    image: newmachinaai/newmachina_perceptron_inference:latest
    container_name: newmachina_perceptron_inference
    command: ["container_inference_src/perceptron_and_inference.py", "--host", "0.0.0.0"]
    ports:
      - "5001:5001"
    volumes:
      - model-data:/app/and_perceptron_model
    depends_on:
      train:
        condition: service_completed_successfully

  harness:
    build: .
    image: newmachinaai/newmachina_perceptron_harness:latest
    container_name: newmachina_perceptron_harness
    command: ["container_harness_src/perceptron_and_harness.py", "--url", "http://inference:5001"]
    stdin_open: true
    tty: true
    profiles: ["tools"]
    depends_on:
      - inference

volumes:
  model-data:
