services:
  train:
    build: .
    container_name: perceptron_train
    command: ["perceptron_and_train.py"]
    volumes:
      - model-data:/app/and_perceptron_model

  inference:
    build: .
    container_name: perceptron_inference
    command: ["perceptron_and_inference.py", "--host", "0.0.0.0"]
    ports:
      - "5000:5000"
    volumes:
      - model-data:/app/and_perceptron_model
    depends_on:
      train:
        condition: service_completed_successfully

  harness:
    build: .
    container_name: perceptron_harness
    command: ["perceptron_and_harness.py", "--url", "http://inference:5000"]
    stdin_open: true
    tty: true
    profiles: ["tools"]
    depends_on:
      - inference

volumes:
  model-data:
